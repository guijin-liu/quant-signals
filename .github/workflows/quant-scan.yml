name: 量化买卖点扫描

on:
  schedule:
    # 北京时间 9:00-11:55 每5分钟 — 上午盘 (is_trading_time 控制 9:15-11:30 实际扫描)
    - cron: '*/5 9-11 * * 1-5'
      timezone: 'Asia/Shanghai'
    # 北京时间 13:00-14:55 每5分钟 — 下午盘
    - cron: '*/5 13-14 * * 1-5'
      timezone: 'Asia/Shanghai'
    # 北京时间 15:00 — 收盘最后一次扫描
    - cron: '0 15 * * 1-5'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:  # 手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 量化扫描
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
        run: python cloud_function.py

      - name: 故障告警
        if: failure()
        run: |
          curl -s -X POST http://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d '{"token":"f3fb5c092ba34785b6857bb45d23d4fa","title":"🚨 量化扫描故障","content":"<div style=\"color:#e74c3c;padding:15px\"><h2>GitHub Actions 扫描失败</h2><p>时间: '"$(TZ='Asia/Shanghai' date +'%m/%d %H:%M')"'</p><p><a href=\"https://github.com/guijin-liu/quant-signals/actions\">查看日志</a></p></div>","template":"html"}'
