name: 挖掘2号规则

on:
  schedule:
    # 每周日 8:30 北京（UTC 0:30）
    - cron: '30 0 * * 0'
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 全量挖掘（动态池 + 东财半年15min + 资金流）
        env:
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
        run: python backtest_miner2.py

      - name: commit rules2.json 回仓库
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rules2.json
          if ! git diff --cached --quiet; then
            git commit -m "update 2号规则 $(TZ='Asia/Shanghai' date +%Y%m%d)"
            git push origin HEAD:master
          else
            echo "规则无变化"
          fi
