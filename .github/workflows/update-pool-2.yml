name: 更新2号动态池

on:
  # 2026-08-27 2号已改固定top70池，动态更新停用（保留手动触发入口）
  # schedule:
  #   # 北京时间 15:40（UTC 7:40），收盘后更新当日成交额top150
  #   - cron: '40 7 * * 1-5'
  workflow_dispatch:

jobs:
  update-pool:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: 拉取成交额top150
        run: python dynamic_pool.py --save-today

      - name: commit回仓库
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/top_amount/
          if ! git diff --cached --quiet; then
            git commit -m "update 2号动态池 $(TZ='Asia/Shanghai' date +%Y%m%d)"
            git push origin HEAD:master
          else
            echo "无新榜单"
          fi

      - name: 榜单完整性检查
        run: |
          python -c '
          import json, glob, os, urllib.request
          files = sorted(glob.glob("data/top_amount/*.json"))
          if files:
              d = json.load(open(files[-1], encoding="utf-8"))
              cnt = d.get("count", 0)
              print("最新榜单 " + os.path.basename(files[-1]) + ": " + str(cnt) + "只")
              if cnt < 150:
                  body = json.dumps({"token":"f3fb5c092ba34785b6857bb45d23d4fa","title":"⚠️ 2号动态池榜单不完整","content":"<div>最新榜单仅" + str(cnt) + "只，不足150，东财/新浪拉取异常，请检查</div>","template":"html"}).encode()
                  urllib.request.urlopen("http://www.pushplus.plus/send", body, timeout=10)
          '
