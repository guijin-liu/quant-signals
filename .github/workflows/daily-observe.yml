name: 每日市场观察

on:
  schedule:
    # 北京时间 16:00（UTC 8:00），收盘后生成每日观察
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: 生成每日市场观察
        env:
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
        run: python daily_observer.py

      - name: commit回仓库
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge/
          if ! git diff --cached --quiet; then
            git commit -m "每日观察 $(TZ='Asia/Shanghai' date +%Y%m%d)"
            git push origin HEAD:master
          else
            echo "无新观察"
          fi
