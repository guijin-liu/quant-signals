name: 量化买卖点扫描·下午

on:
  schedule:
    # 北京时间 13:00 触发（UTC 5:00），周一~周五，下午段跑到 15:00 收盘（market_state 自动 closed 退出）
    - cron: '0 5 * * 0-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 下午盘扫描（13:00→15:00）
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
          SCAN_DEADLINE: "15:00"
        run: python cloud_function.py

      - name: 故障告警
        if: failure()
        run: |
          curl -s -X POST http://www.pushplus.plus/send \
            -H "Content-Type: application/json" \
            -d '{"token":"f3fb5c092ba34785b6857bb45d23d4fa","title":"🚨 量化扫描故障(下午)","content":"<div style=\"color:#e74c3c;padding:15px\"><h2>GitHub Actions 下午扫描失败</h2><p>时间: '"$(TZ='Asia/Shanghai' date +'%m/%d %H:%M')"'</p><p><a href=\"https://github.com/guijin-liu/quant-signals/actions\">查看日志</a></p></div>","template":"html"}'
