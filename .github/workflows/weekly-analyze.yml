name: 周度规律分析

on:
  schedule:
    # 北京时间 周日 10:20（UTC 2:20）
    - cron: '20 2 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: 周度规律分析
        env:
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
        run: python weekly_analyzer.py

      - name: commit回仓库
        run: |
          git config user.name "quant-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge/
          if ! git diff --cached --quiet; then
            git commit -m "周度规律 $(TZ='Asia/Shanghai' date +%Y%m%d)"
            git push origin HEAD:master
          else
            echo "无新分析"
          fi
